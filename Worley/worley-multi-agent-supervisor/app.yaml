command:
  - /bin/bash
  - -c
  - "cd frontend && npm install && npm run build && cd .. && uvicorn app:app --host 0.0.0.0 --port 8000"

env:
  - name: SUPERVISOR_ENDPOINT
    value: "worley-supervisor-agent"

compute:
  size: large

resources:
  - name: "serving-endpoint"
    description: "Supervisor agent serving endpoint"
    serving_endpoint:
      name: "worley-supervisor-agent"
      permission: "CAN_QUERY"
