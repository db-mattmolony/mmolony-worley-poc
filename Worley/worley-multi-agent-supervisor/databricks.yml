bundle:
  name: worley-supervisor-poc

targets:
  default:
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

  development:
    workspace:
      host: https://adb-7405604717684409.9.azuredatabricks.net
      profile: worley-dev

resources:
  apps:
    supervisor_app:
      name: "worley-supervisor-app"
      description: "Worley Multi-Agent Supervisor Chat UI"
      source_code_path: .
      config:
        command:
          - uvicorn
          - app:app
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
        env:
          - name: SUPERVISOR_ENDPOINT
            value: "worley-supervisor-agent"
      resources:
        - name: "serving-endpoint"
          description: "Supervisor agent serving endpoint"
          serving_endpoint:
            name: "worley-supervisor-agent"
            permission: "CAN_QUERY"

  jobs:
    deploy_agent:
      name: "worley-supervisor-deploy-agent"
      tags:
        poc_id: "UC2"
      tasks:
        # - task_key: create_catalog
        #   notebook_task:
        #     notebook_path: setup/00_create_catalog.py
        #   environment_key: default

        # - task_key: register_foundry_endpoints
        #   depends_on:
        #     - task_key: create_catalog
        #   notebook_task:
        #     notebook_path: setup/01_register_foundry_endpoints.py
        #   environment_key: default

        - task_key: deploy_foundry_otel
          notebook_task:
            notebook_path: setup/03_deploy_foundry_otel.py
          environment_key: default

        - task_key: deploy_mlflow_model
          depends_on:
            - task_key: deploy_foundry_otel
          notebook_task:
            notebook_path: setup/02_deploy_agent_mlflow.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
